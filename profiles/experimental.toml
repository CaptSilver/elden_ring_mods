# Testbed for mods that aren't trusted in the shared stack yet. Composes
# seamless-full, so `erm switch experimental` gives you the whole co-op setup
# plus whatever's being tried out — switching to a standalone profile would
# uninstall Seamless along with everything else.
name = "experimental"
description = "seamless-full plus whatever is currently on trial. On trial now: Map for Goblins (#10062), pending an in-game check. The notes below record rejected candidates so they don't get re-added. Nothing here is ever required by co-op partners."

includes = ["seamless-full"]

# --- tried and rejected ---
# questpath (#10363) DISABLED — it kills the game during startup on this box.
# Every launch with it died ~10ms after its own log recorded "DXGI creation
# hooks installed" and "NVIDIA NVAPI HDR observer installed", between me3's
# wwise and device_manager asset hooks, taking Elden Mod Loader down mid-DLL-
# loop with it (mod_loader_log.txt truncates after the first entry instead of
# reaching "Loaded N .dll mods"). Removing it fixed the boot with nothing else
# changed. Untested theory: it fights ReShade, which already owns dxgi.dll here
# — so it may be fine on a machine without ReShade. The NVAPI hook on a Radeon
# is the other suspect.
#
# To re-enable: nexus_id=10363, kind="qol", install="me3-native". It needs
# me3-native rather than "mods" because its dll sits inside a QuestPath/ folder
# and Elden Mod Loader only scans mods/*.dll — it never recurses. Try its ini's
# overlay toggle first; the quest tracking may work with the overlay off.
#
# starlight-shards-rune-arcs (#9030, krios2146) DISABLED — it does not support
# this game build. It was meant to make the Starlight Shard FP-regen buff last
# until death instead of the vanilla ~90s, by patching speffect 501290 in memory.
#
# It loads fine and does nothing. Tested through BOTH loaders: Elden Mod Loader
# from Game/mods/ (injects on a 5000 ms delay) and me3 as a chainloaded native
# (injects at startup). Identical result, so it isn't a delivery or timing
# problem — shards expired on their normal timer either way.
#
# The binary says why. It carries a hardcoded AOB signature scanned through
# pelite, and the literal string "This game version or distribution is not
# supported" beside Rust panic machinery: the scan misses on this build and its
# worker thread dies without surfacing anything. Nothing fixable from outside;
# it needs the author to re-sign for the current patch.
#
# Its mods.lock.toml pin is deliberately kept, like questpath's, so the vendor
# archive stays hash-verified. To retry after an update: nexus_id=9030,
# kind="qol", install="me3-native" (its MAIN archive is a bare .dll, so either
# loader works). Verify by popping a shard and watching the FP regen outlast its
# normal timer — "it loaded" proves nothing here, that is exactly how it failed.

# --- on trial ---
# Map for Goblins (#10062, DLL rebuild) — a world-map overlay that drops ~6900
# loot/boss/grace icons onto the map, plus an in-game ImGui panel (F10, or Y+R3
# on a pad) to toggle icon categories live. No regulation.bin; injects at runtime.
# file_id 48311 is the "Vanilla or Randomizer" DLL build; the mod ships NINE MAIN
# files at once (one per overhaul), so the id must be pinned. Never the original
# #3091 — that one carries a regulation.bin and would fight Clever's for the slot.
#
# install = "me3-native", NOT "mods": Elden Mod Loader here runs load_delay=5000,
# which injects DLLs ~5s in, AFTER the world map is built — so the icons never
# attach and the mod silently shows nothing. me3 chainloads natives at launch,
# early enough for the icons, and keeps MapForGoblins.ini beside the dll (the mod
# reads its config from next to the binary). We launch through me3 anyway.
#
# The earlier rejection ("no controller input") was wrong — Y+R3 was never
# actually tried. The real friction is that the config panel is mouse-driven, so
# editing categories wants a mouse (Deck trackpad / Steam Input). The F10 overlay
# and live category toggles are on by default in the shipped ini. Client-side
# overlay that only reads item placement — it doesn't desync, no partner needs it.
#
# Verify in-game before promoting: icons actually appear on the world map and F10
# opens the panel. Then move to seamless-full + single-full.
[[mods]]
id = "map-for-goblins"
source = "nexus"
nexus_id = 10062
file_id = 48311
kind = "qol"
install = "me3-native"
