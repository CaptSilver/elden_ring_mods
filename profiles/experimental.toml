# Testbed for mods that aren't trusted in the shared stack yet. Composes
# seamless-full, so `erm switch experimental` gives you the whole co-op setup
# plus whatever's being tried out — switching to a standalone profile would
# uninstall Seamless along with everything else.
name = "experimental"
description = "seamless-full plus whatever is currently on trial. Nothing is on trial right now — Map for Goblins and NoFallDead both passed their in-game checks and were promoted. The notes below record rejected candidates so they don't get re-added. Nothing here is ever required by co-op partners."

includes = ["seamless-full"]

# --- tried and rejected ---
# questpath (#10363) DISABLED — it kills the game during startup on this box.
# Every launch with it died ~10ms after its own log recorded "DXGI creation
# hooks installed" and "NVIDIA NVAPI HDR observer installed", between me3's
# wwise and device_manager asset hooks, taking Elden Mod Loader down mid-DLL-
# loop with it (mod_loader_log.txt truncates after the first entry instead of
# reaching "Loaded N .dll mods"). Removing it fixed the boot with nothing else
# changed. Untested theory: it fights ReShade, which already owns dxgi.dll here
# — so it may be fine on a machine without ReShade. The NVAPI hook on a Radeon
# is the other suspect.
#
# To re-enable: nexus_id=10363, kind="qol", install="me3-native". It needs
# me3-native rather than "mods" because its dll sits inside a QuestPath/ folder
# and Elden Mod Loader only scans mods/*.dll — it never recurses. Try its ini's
# overlay toggle first; the quest tracking may work with the overlay off.
#
# starlight-shards-rune-arcs (#9030, krios2146) DISABLED — it does not support
# this game build. It was meant to make the Starlight Shard FP-regen buff last
# until death instead of the vanilla ~90s, by patching speffect 501290 in memory.
#
# It loads fine and does nothing. Tested through BOTH loaders: Elden Mod Loader
# from Game/mods/ (injects on a 5000 ms delay) and me3 as a chainloaded native
# (injects at startup). Identical result, so it isn't a delivery or timing
# problem — shards expired on their normal timer either way.
#
# The binary says why. It carries a hardcoded AOB signature scanned through
# pelite, and the literal string "This game version or distribution is not
# supported" beside Rust panic machinery: the scan misses on this build and its
# worker thread dies without surfacing anything. Nothing fixable from outside;
# it needs the author to re-sign for the current patch.
#
# Its mods.lock.toml pin is deliberately kept, like questpath's, so the vendor
# archive stays hash-verified. To retry after an update: nexus_id=9030,
# kind="qol", install="me3-native" (its MAIN archive is a bare .dll, so either
# loader works). Verify by popping a shard and watching the FP regen outlast its
# normal timer — "it loaded" proves nothing here, that is exactly how it failed.


# --- on trial ---
# Add a [[mods]] entry here with the in-game check that would promote it, and the
# profile it graduates to. Earned promotion so far: map-for-goblins (icons appear,
# F10 panel opens) to seamless-full + single-full; nofalldead (talisman survives a
# 20 m drop) to gameplay-extras with both of its merge declarations.
#
# NOTE for both mods below: they edit regulation.bin, so their rows are
# transplanted onto Clever's by the [[merges]] entry in gameplay-extras. That
# declaration has to name every provider, so it lists these two even though they
# live here — a second declaration for the same path would be refused as a
# disagreement, and a provider missing from the declaration aborts the apply.

# 100 Percent Drop Rate (#9929, jaxkole522) — the Silver Scarab talisman gives a
# 100% item drop rate. Surgical: exactly two rows, ItemLotParam row 0 and
# SpEffect 311000 (the talisman's effect). Clean against every other mod here.
#
# Acquisition cheat, in the same class as ErdTools, which `erm doctor` already
# warns about. Fine under Seamless — separate .co2 save, EAC never runs — but
# never take that save to vanilla online.
#
# Verify: kill something that drops a rare item with the Silver Scarab equipped
# and confirm it drops every time. Works → gameplay-extras (it's a regulation
# mod, so requires_all_players).
[[mods]]
id = "drop-rate-100"
source = "nexus"
nexus_id = 9929
file_id = 46821
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Forever Buffs / All Weapon Buffable (#8644, razibur) — the "Buffs last 3
# minutes" build. 2,921 changed rows: 2,821 EquipParamWeapon (making everything
# buffable), 67 SpEffect (the 3-minute durations), 33 EquipParamGoods.
#
# file_id MUST stay pinned: the page ships TWO MAIN files. 39767 is this one;
# 39807 is "Forever Buffs N all kinds of Buff included", a different behaviour.
#
# It overlaps Clever's on 39 weapon rows, and every one is a different FIELD —
# this mod only sets one buffable flag byte per row while Clever's rewrites
# moveset and attack fields elsewhere. param-rows merges within a row at byte
# granularity, so those resolve rather than conflicting.
#
# The archive is the author's whole Smithbox workspace: 245 files, of which only
# regulation.bin is content. Its systemparam is byte-identical to the .prev the
# editor wrote beside it, so the author never touched it — pruned below rather
# than mounted over vanilla. The .smithbox/ tree isn't a game path, so the game
# never asks for it.
#
# Verify: buff a weapon that vanilla can't buff, and time a grease at ~3 minutes.
# Works → gameplay-extras.
[[mods]]
id = "forever-buffs"
source = "nexus"
nexus_id = 8644
file_id = 39767                   # "Buffs last 3 minutes" — NOT 39807
kind = "gameplay"
install = "me3-package"
# Auto-placement can't find the root on its own: it descends through a single
# wrapper folder, and Files/ holds two (mod/ and "CSV 4 Merge/"), so it stops.
subdir = "Files/mod"
requires_all_players = true

# Unedited editor artifact, exactly like the Boss Res systemparam in
# gameplay-extras: identical to the .prev Smithbox saved beside it, so it carries
# nothing of the author's. Mounting it would override vanilla systemparam for no
# reason.
[[prunes]]
mod = "forever-buffs"
paths = [
    "param/systemparam/systemparam.parambnd.dcx",
    "param/systemparam/systemparam.parambnd.dcx.prev",
]
