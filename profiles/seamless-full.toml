# Ships erquestlog.dll, an .ini and a questlog_lang/ dir inside a wrapper
# folder, which the mods install strips. Presents through the game's own menu
# system rather than drawing its own overlay — hence the translation files.
# Reads quest flags, writes nothing back, so it's per-player like the rest here.
[[mods]]
id = "quest-log"
source = "nexus"
nexus_id = 3585
kind = "qol"
install = "mods"

# NOTE: ReShade (reshade.me) + the Tarnished preset and RandomizerHelper (bundled inside
# the randomizer #428 download) are NOT listed as fetchable mods — ReShade is a general
# injector installed from reshade.me; RandomizerHelper ships with #428.

# Map for Goblins (#10062, DLL rebuild) — a world-map overlay that drops ~6900
# loot/boss/grace icons onto the map, plus an in-game ImGui panel (F10, or Y+R3
# on a pad) to toggle icon categories live. Confirmed working in game 2026-07-27.
#
# Client-side: it only reads item placement and draws over the map, so it can't
# desync and no co-op partner needs it. That's why it sits here rather than in
# gameplay-extras.
#
# install = "me3-native", NOT "mods": Elden Mod Loader runs load_delay=5000 here,
# injecting DLLs ~5s in, AFTER the world map is built — the icons never attach
# and the mod silently shows nothing. me3 chainloads natives at launch, early
# enough, and keeps MapForGoblins.ini beside the dll (the mod reads its config
# from next to the binary).
#
# file_id MUST stay pinned: the mod ships nine MAIN files at once, one per
# overhaul. 48311 is the "Vanilla or Randomizer" DLL build. Never the original
# #3091 — that one carries a regulation.bin and would fight Clever's for it.
#
# The config panel is mouse-driven, so editing categories wants a mouse (Deck
# trackpad / Steam Input). F10 and the live toggles are on by default in the ini.
[[mods]]
id = "map-for-goblins"
source = "nexus"
nexus_id = 10062
file_id = 48311
kind = "qol"
install = "me3-native"

# RadialMenu (#9832, LorenzoFaith) — hold the change-spell or change-item bind to
# get a wheel instead of cycling one at a time. Reads names and icons out of the
# running game rather than a fixed table, so Clever's weapons and DLC items show
# up correctly. Confirmed in game 2026-08-09.
#
# The best fit here for a controller playthrough: D-pad up/down to open, right
# stick to pick, release to confirm. Short taps still cycle the vanilla way, so
# it costs nothing when you don't want it.
#
# me3-native because the dll sits inside a RadialMenu/ folder next to the .me3
# profile it ships; find_native_dll recurses to it, and the mod writes
# RadialMenu.log beside the binary.
#
# Client-side: it only reads game state and draws, so no partner needs it. It
# does draw an overlay, joining ReShade and Map for Goblins on the swapchain —
# that contention has bitten this stack before, so pull it first if the game
# starts dying at startup.
[[mods]]
id = "radialmenu"
source = "nexus"
nexus_id = 9832
file_id = 46913
kind = "qol"
install = "me3-native"

# Expanded Talisman Slots (#10481, imCioco) — up to 8 extra talisman slots on top
# of whatever the save has unlocked. The equipment screen has a hard cap on how
# many slots it can draw, so the extra ones live in a menu the mod adds to the
# Site of Grace list; the two views stay in sync. Confirmed in game 2026-08-09.
#
# me3-native, not "mods": it reads ExpandedTalismanSlots.ini from beside the
# binary, and me3-native extracts the whole archive so the ini travels with the
# dll. The author recommends me3 first as well. Default is 3 extra slots.
#
# It's here rather than gameplay-extras because it changes no shared game data —
# the slots are applied client-side. It does change what your character can
# equip, though, so it's a fairness question for the party even if it isn't a
# desync one.
[[mods]]
id = "expanded-talisman-slots"
source = "nexus"
nexus_id = 10481
file_id = 48747
kind = "gameplay"
install = "me3-native"

# Damage Competition (#10461, Xykcu) — floating damage numbers coloured by status
# proc, a DPS meter with boss names, a player list with HP/ping, and text chat.
# Solo gives the damage meter; Seamless unlocks the networked half. Confirmed in
# game 2026-08-09.
#
# file_id MUST stay pinned. The other file on that page is a branch for a pirated
# build of the game — the author says so in its own description and recommends
# against it. 48887 is the real MAIN.
#
# install = "mods": the author documents Elden Mod Loader's mods/ folder, the
# archive is a bare dll, and the ini is written next to it on first launch.
# F5 opens settings, F6 reloads the ini, Enter is chat.
#
# Client-side, but it's the one mod here that's better when everyone runs it —
# the player list and networked damage only show partners who also have it.
# Another overlay, same swapchain caveat as RadialMenu.
[[mods]]
id = "damage-competition"
source = "nexus"
nexus_id = 10461
file_id = 48887
kind = "qol"
install = "mods"
