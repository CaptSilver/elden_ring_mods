name = "gameplay-extras"
description = "SHARED gameplay mods for Seamless Co-op. Opposite of cosmetic-extras: every player in the party must run the IDENTICAL set, or you desync. Ban-safe under Seamless (no EAC, separate .co2 save) — but never take that .co2 to vanilla online. Layers on top of a coop base like seamless-full."
excludes = ["randomizer"]

# Boss Resurrection Lite — re-fight bosses without NG+, via a site-of-grace menu.
# The LITE build has no regulation.bin, so it doesn't claim the single regulation
# slot and won't collide with the randomizer. v2.0.1 is DLC-current. Every player
# needs the identical file.
#
# It collides with Clever's on msg/engus/menu_dlc02.msgbnd.dcx — see [[merges]]
# below. Its item_dlc02 and systemparam are byte-identical to the mod's own
# baseline (it ships them untouched), and the item_dlc02 is a July-2024 vanilla
# that would roll back item text, so both are pruned rather than merged.
[[mods]]
id = "boss-resurrection-lite"
source = "nexus"
nexus_id = 2790
file_id = 24925                   # "Boss Resurrection - Lite" v2.0.1 (post-DLC)
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Clever's Moveset Modpack — new weapon movesets + animations. EDITS regulation.bin
# + c0000.anibnd (the character animation bundle), so it claims the ONE regulation
# slot (fine now the randomizer is disabled — don't add another regulation mod).
# v25.0, ~621MB, for ER 1.16/1.16.1. SHARED: every player needs the identical pack.
# Turn OFF ray tracing in-game for stability (per the mod page).
[[mods]]
id = "clevers-moveset"
source = "nexus"
nexus_id = 1928
file_id = 34558                   # "moveset_modpack 25.0" (ER 1.16/1.16.1)
kind = "overhaul"
install = "me3-package"
requires_all_players = true

# NoFallDead (Longtail Cat Talisman version, #10402) — the talisman stops death
# from a high fall, not just the damage. Confirmed in game 2026-07-27.
#
# It carries its own regulation.bin, which would normally make it unusable next
# to Clever's since me3 mounts one file per path. The [[merges]] below transplant
# its three SpEffect rows onto Clever's instead, so Clever's stays the base and
# keeps every row it authored. The mechanism is SpEffect stateInfo 266, reached
# through a chain of all three rows — none of them is optional.
#
# SHARED, like everything else here: the merged regulation.bin must be identical
# across the party. erm's merge is deterministic, so every player who applies
# this profile off the same pins gets byte-identical output — nobody has to
# hand-distribute a file.
#
# file_id MUST stay pinned: the mod ships two MAIN files. 48339 hooks a resident
# speffect of the author's own and is always on; 48340 gates the effect behind
# the talisman by editing the row vanilla already points at, which needs no
# EquipParamAccessory change and is the narrower edit.
[[mods]]
id = "nofalldead"
source = "nexus"
nexus_id = 10402
file_id = 48340                   # "Longtail Cat Talisman Version" — NOT the always-on 48339
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Forever Buffs / All Weapon Buffable (#8644, razibur) — the "Buffs last 3
# minutes" build. Confirmed in game 2026-07-27: weapons that vanilla can't buff
# now take a buff, and grease persists instead of expiring.
#
# 2,921 changed rows — 2,821 EquipParamWeapon making everything buffable, 67
# SpEffect for the durations, 33 EquipParamGoods. It overlaps Clever's on 39
# weapon rows and every one is a different FIELD: this mod sets one buffable flag
# byte per row while Clever's rewrites moveset and attack fields elsewhere, so
# param-rows composes them inside the row. Both mods' behaviour survives intact,
# which is the in-game proof that the byte-granular merge is doing the right
# thing at scale.
#
# file_id MUST stay pinned: the page ships TWO MAIN files. 39767 is this one;
# 39807 is "Forever Buffs N all kinds of Buff included", different behaviour.
#
# `subdir` is required because auto-placement descends through a single wrapper
# folder and this archive's Files/ holds two (mod/ and "CSV 4 Merge/").
[[mods]]
id = "forever-buffs"
source = "nexus"
nexus_id = 8644
file_id = 39767                   # "Buffs last 3 minutes" — NOT 39807
kind = "gameplay"
install = "me3-package"
subdir = "Files/mod"
requires_all_players = true

# 100 Percent Drop Rate (#9929, jaxkole522) — the Silver Scarab talisman gives a
# 100% item drop rate. Two rows: ItemLotParam row 0 and SpEffect 311000, the
# talisman's own effect. Clean against every other mod here.
#
# ACCEPTED WITHOUT THE IN-GAME CHECK, deliberately. The Silver Scarab sits far
# enough into the game that David couldn't reach it to test; what's actually
# confirmed is that the merged regulation loads and nothing else regressed. If
# drop rates ever look wrong, this is the first thing to suspect — the check is
# still: equip the Silver Scarab, kill something with a rare drop, confirm it
# drops every time.
#
# It's here rather than in experimental because the merged regulation.bin is
# built from whichever profile is applied: leaving a regulation mod out of the
# shared profile gives partners a different file, which reads as a failure to
# connect rather than a desync.
#
# Acquisition cheat, same class as ErdTools, which `erm doctor` warns about.
# Fine under Seamless — separate .co2, EAC never runs — but never take that save
# to vanilla online.
[[mods]]
id = "drop-rate-100"
source = "nexus"
nexus_id = 9929
file_id = 46821
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# --- Summon Ashes Anywhere REMOVED (co-op incompatible) ---
# SummonAnywhere.dll (nexus 5434, file 23945, v1.12.1) loaded fine via Elden Mod
# Loader (Game/mods/) but was useless in Seamless Co-op: summons couldn't be
# dismissed and wouldn't follow past certain area transitions — a mod-behaviour
# problem in co-op, not a loader/install issue. Was: install="mods".

# Both mods ship this archive. me3 mounts one file per path and drops the other
# silently, which is why boss resurrection's menu rendered as tofu before. The
# two mods' text ids are disjoint, so a union keeps both; Clever's wins the one
# id they share (it replaces a vanilla save-failure string with its own note).
[[merges]]
path = "msg/engus/menu_dlc02.msgbnd.dcx"
strategy = "fmg-union"
mods = ["clevers-moveset", "boss-resurrection-lite"]
prefer = "clevers-moveset"

# Clever's keeps the regulation; NoFallDead's three changed SpEffect rows are
# transplanted onto it. Which rows move is worked out from the data, so this
# doesn't go stale if either mod updates — but a row they BOTH change stops the
# apply rather than picking a winner.
#
# Both merges compare against the vanilla file the two mods branched from, taken
# from the randomizer's bundled Vanilla/ directory. That archive is pinned in
# mods.lock.toml and its regulation.bin is byte-identical to the game install's.
# Read from the vendor zip, not tools/, because tools/ only exists while the
# randomizer profile is applied and this profile excludes it. Applying without
# that archive fetched fails with a message saying so.
# `mods` names every regulation-carrying mod in any profile that composes this
# one, not just the ones installed here. A provider missing from the list aborts
# the apply, and a second declaration for the same path elsewhere would be
# refused as a disagreement — so this is the one place it can live. Declared-but-
# not-installed is fine, which is what lets the experimental trials list here
# while applying gameplay-extras alone still merges just Clever's + NoFallDead.
[[merges]]
path = "regulation.bin"
strategy = "param-rows"
mods = ["clevers-moveset", "nofalldead", "drop-rate-100", "forever-buffs"]
prefer = "clevers-moveset"
vanilla = { mod = "item-enemy-randomizer", member = "randomizer/diste/Vanilla/regulation.bin" }

# The talisman's description, in two places: the short info line and the long
# caption both say it does NOT prevent death from a high fall. Clever's ships
# this archive too, carrying vanilla text for those rows and its own edits to
# 1,391 others, so a two-way union is wrong in both directions — it would drop
# one side or the other. Three-way against vanilla keeps both.
[[merges]]
path = "msg/engus/item_dlc02.msgbnd.dcx"
strategy = "fmg-3way"
mods = ["clevers-moveset", "nofalldead"]
prefer = "clevers-moveset"
vanilla = { mod = "item-enemy-randomizer", member = "randomizer/diste/Vanilla/msg/engus/item_dlc02.msgbnd.dcx" }

# Unedited editor artifact, same as the Boss Res systemparam below: byte-identical
# to the .prev Smithbox wrote beside it, so it carries nothing of the author's.
# Mounting it would override vanilla systemparam for no reason. The archive is the
# author's whole workspace — 245 files, of which only regulation.bin is content.
[[prunes]]
mod = "forever-buffs"
paths = [
    "param/systemparam/systemparam.parambnd.dcx",
    "param/systemparam/systemparam.parambnd.dcx.prev",
]

[[prunes]]
mod = "boss-resurrection-lite"
paths = [
    "msg/engus/item_dlc02.msgbnd.dcx",
    "param/systemparam/systemparam.parambnd.dcx",
]
