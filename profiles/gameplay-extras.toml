name = "gameplay-extras"
description = "SHARED gameplay mods for Seamless Co-op. Opposite of cosmetic-extras: every player in the party must run the IDENTICAL set, or you desync. Ban-safe under Seamless (no EAC, separate .co2 save) — but never take that .co2 to vanilla online. Layers on top of a coop base like seamless-full."
excludes = ["randomizer"]

# Boss Resurrection Lite — re-fight bosses without NG+, via a site-of-grace menu.
# The LITE build has no regulation.bin, so it doesn't claim the single regulation
# slot and won't collide with the randomizer. v2.0.1 is DLC-current. Every player
# needs the identical file.
#
# It collides with Clever's on msg/engus/menu_dlc02.msgbnd.dcx — see [[merges]]
# below. Its item_dlc02 and systemparam are byte-identical to the mod's own
# baseline (it ships them untouched), and the item_dlc02 is a July-2024 vanilla
# that would roll back item text, so both are pruned rather than merged.
[[mods]]
id = "boss-resurrection-lite"
source = "nexus"
nexus_id = 2790
file_id = 24925                   # "Boss Resurrection - Lite" v2.0.1 (post-DLC)
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Journey with Melina (#10079, BITEMYDUSTO) — Melina sits with you at every
# grace, minus the stretches the story says she shouldn't. One file, a talk
# ESD, merged with Boss Resurrection's copy of the same file.
#
# Shared rather than client-side: the merged talkesd is built from whichever
# profile is applied, so a partner who doesn't run her gets a different file.
# Whether that desyncs or just means she isn't there for them is untested.
[[mods]]
id = "journey-with-melina"
source = "nexus"
nexus_id = 10079
file_id = 47405
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Clever's Moveset Modpack — new weapon movesets + animations. EDITS regulation.bin
# + c0000.anibnd (the character animation bundle), so it claims the ONE regulation
# slot (fine now the randomizer is disabled — don't add another regulation mod).
# SHARED: every player needs the identical pack. Turn OFF ray tracing in-game
# for stability (per the mod page).
#
# Held at 25.0 on purpose: it's the `prefer` mod in the six-way regulation
# merge and `requires_all_players`, and 26.1 (file 49639) changes both
# movesets and regulation contents. Taking it alongside the patch-adaptability
# work would tangle two possible failure sources into one. It moves on its
# own, with its own in-game pass, once both players update together — drop
# `freeze` when that happens.
[[mods]]
id = "clevers-moveset"
source = "nexus"
nexus_id = 1928
file_id = 34558                   # "moveset_modpack 25.0"
freeze = true
kind = "overhaul"
install = "me3-package"
requires_all_players = true

# NoFallDead (Longtail Cat Talisman version, #10402) — the talisman stops death
# from a high fall, not just the damage. Confirmed in game 2026-07-27.
#
# It carries its own regulation.bin, which would normally make it unusable next
# to Clever's since me3 mounts one file per path. The [[merges]] below transplant
# its three SpEffect rows onto Clever's instead, so Clever's stays the base and
# keeps every row it authored. The mechanism is SpEffect stateInfo 266, reached
# through a chain of all three rows — none of them is optional.
#
# SHARED, like everything else here: the merged regulation.bin must be identical
# across the party. erm's merge is deterministic, so every player who applies
# this profile off the same pins gets byte-identical output — nobody has to
# hand-distribute a file.
#
# file_id MUST stay pinned: the mod ships two MAIN files. 48339 hooks a resident
# speffect of the author's own and is always on; 48340 gates the effect behind
# the talisman by editing the row vanilla already points at, which needs no
# EquipParamAccessory change and is the narrower edit.
[[mods]]
id = "nofalldead"
source = "nexus"
nexus_id = 10402
file_id = 48340                   # "Longtail Cat Talisman Version" — NOT the always-on 48339
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Forever Buffs / All Weapon Buffable (#8644, razibur) — the "Buffs last 3
# minutes" build. Confirmed in game 2026-07-27: weapons that vanilla can't buff
# now take a buff, and grease persists instead of expiring.
#
# 2,921 changed rows — 2,821 EquipParamWeapon making everything buffable, 67
# SpEffect for the durations, 33 EquipParamGoods. It overlaps Clever's on 39
# weapon rows and every one is a different FIELD: this mod sets one buffable flag
# byte per row while Clever's rewrites moveset and attack fields elsewhere, so
# param-rows composes them inside the row. Both mods' behaviour survives intact,
# which is the in-game proof that the byte-granular merge is doing the right
# thing at scale.
#
# file_id MUST stay pinned: the page ships TWO MAIN files. 39767 is this one;
# 39807 is "Forever Buffs N all kinds of Buff included", different behaviour.
#
# `subdir` is required because auto-placement descends through a single wrapper
# folder and this archive's Files/ holds two (mod/ and "CSV 4 Merge/").
[[mods]]
id = "forever-buffs"
source = "nexus"
nexus_id = 8644
file_id = 39767                   # "Buffs last 3 minutes" — NOT 39807
kind = "gameplay"
install = "me3-package"
subdir = "Files/mod"
requires_all_players = true

# 100 Percent Drop Rate (#9929, jaxkole522) — the Silver Scarab talisman gives a
# 100% item drop rate. Two rows: ItemLotParam row 0 and SpEffect 311000, the
# talisman's own effect. Clean against every other mod here.
#
# ACCEPTED WITHOUT THE IN-GAME CHECK, deliberately. The Silver Scarab sits far
# enough into the game that David couldn't reach it to test; what's actually
# confirmed is that the merged regulation loads and nothing else regressed. If
# drop rates ever look wrong, this is the first thing to suspect — the check is
# still: equip the Silver Scarab, kill something with a rare drop, confirm it
# drops every time.
#
# It's here rather than in experimental because the merged regulation.bin is
# built from whichever profile is applied: leaving a regulation mod out of the
# shared profile gives partners a different file, which reads as a failure to
# connect rather than a desync.
#
# Acquisition cheat, same class as ErdTools, which `erm doctor` warns about.
# Fine under Seamless — separate .co2, EAC never runs — but never take that save
# to vanilla online.
[[mods]]
id = "drop-rate-100"
source = "nexus"
nexus_id = 9929
file_id = 46821
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Great Rune Overhaul (#2869, Blabla) — each Great Rune gains a small permanent
# passive once activated at its Divine Tower, and they stack. The Rune Arc
# activation still works as normal on top. Confirmed in game 2026-08-09.
#
# 28 new SpEffect rows, 3 modified, 3 new SpEffectVfx. No other mod touches those
# rows. Its BND4 reports game build 11601000, same as Clever's.
#
# It ships three other files, each handled differently below: event/common.emevd.dcx
# is content and mounts as sole provider (it's what grants the passives), the
# msgbnd needs a rename because it ships under msg/engUS/, and the menu atlas
# needs a union with Clever's or the rune status icons render as green squares.
[[mods]]
id = "great-rune-overhaul"
source = "nexus"
nexus_id = 2869
file_id = 31870
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# Better Bows and Arrows (#4628, Ragius25) — arrow stacks to 250, faster special
# arrows, reworked crossbow/ballista scaling, and a 1.5x sneak multiplier with
# bows instead of 1.2x. Confirmed in game 2026-08-09.
#
# 127 Bullet rows, 35 EquipParamWeapon, 1 GameSystemCommonParam. Its BND4 reports
# 11611000 — exactly the current vanilla build.
#
# All 35 weapon rows are ALSO edited by Clever's or Forever Buffs, and the merge
# composes them inside the row: every byte this mod authored survives alongside
# theirs. Arrow stacks past 99 while Clever's bow movesets still behave is what
# proves that in game, and it's the widest test the intra-row merge has had.
#
# file_id 41004 is the MAIN regulation, which is v1.2. The page's v1.5 content
# (doubled special-arrow speed, faster Through & Through) ships ONLY as CSVs for
# Smithbox, and erm merges regulations, not CSVs — so this deliberately installs
# v1.2 while the page reads v1.5. Not a stale pin; re-check if a v1.5 regulation
# ever appears.
[[mods]]
id = "better-bows-and-arrows"
source = "nexus"
nexus_id = 4628
file_id = 41004
kind = "gameplay"
install = "me3-package"
requires_all_players = true

# --- Summon Ashes Anywhere REMOVED (co-op incompatible) ---
# SummonAnywhere.dll (nexus 5434, file 23945, v1.12.1) loaded fine via Elden Mod
# Loader (Game/mods/) but was useless in Seamless Co-op: summons couldn't be
# dismissed and wouldn't follow past certain area transitions — a mod-behaviour
# problem in co-op, not a loader/install issue. Was: install="mods".

# Both mods ship this archive. me3 mounts one file per path and drops the other
# silently, which is why boss resurrection's menu rendered as tofu before. The
# two mods' text ids are disjoint, so a union keeps both; Clever's wins the one
# id they share (it replaces a vanilla save-failure string with its own note).
[[merges]]
path = "msg/engus/menu_dlc02.msgbnd.dcx"
strategy = "fmg-union"
mods = ["clevers-moveset", "boss-resurrection-lite"]
prefer = "clevers-moveset"

# Clever's keeps the regulation; NoFallDead's three changed SpEffect rows are
# transplanted onto it. Which rows move is worked out from the data, so this
# doesn't go stale if either mod updates — but a row they BOTH change stops the
# apply rather than picking a winner.
#
# Both merges compare against the vanilla file the two mods branched from, taken
# from the randomizer's bundled Vanilla/ directory. That archive is pinned in
# mods.lock.toml and its regulation.bin is byte-identical to the game install's.
# Read from the vendor zip, not tools/, because tools/ only exists while the
# randomizer profile is applied and this profile excludes it. Applying without
# that archive fetched fails with a message saying so.
# `mods` names every regulation-carrying mod in any profile that composes this
# one, not just the ones installed here. A provider missing from the list aborts
# the apply, and a second declaration for the same path elsewhere would be
# refused as a disagreement — so this is the one place it can live. Declared-but-
# not-installed is fine, which is what lets the experimental trials list here
# while applying gameplay-extras alone still merges just Clever's + NoFallDead.
[[merges]]
path = "regulation.bin"
strategy = "param-rows"
mods = ["clevers-moveset", "nofalldead", "drop-rate-100", "forever-buffs",
        "great-rune-overhaul", "better-bows-and-arrows"]
prefer = "clevers-moveset"
vanilla = { mod = "item-enemy-randomizer", member = "randomizer/diste/Vanilla/regulation.bin" }

# The talisman's description, in two places: the short info line and the long
# caption both say it does NOT prevent death from a high fall. Clever's ships
# this archive too, carrying vanilla text for those rows and its own edits to
# 1,391 others, so a two-way union is wrong in both directions — it would drop
# one side or the other. Three-way against vanilla keeps both.
#
# Great Rune Overhaul joins on the same file with 14 strings — the seven Great
# Rune info lines and their seven captions, rewritten to describe the passives
# it adds. Not one of them collides with what the other two changed, so all
# three fold in cleanly. It ships them under msg/engUS/, hence the rename below.
[[merges]]
path = "msg/engus/item_dlc02.msgbnd.dcx"
strategy = "fmg-3way"
mods = ["clevers-moveset", "nofalldead", "great-rune-overhaul"]
prefer = "clevers-moveset"
vanilla = { mod = "item-enemy-randomizer", member = "randomizer/diste/Vanilla/msg/engus/item_dlc02.msgbnd.dcx" }

# Great Rune Overhaul ships its text under msg/engUS/; Clever's, NoFallDead and
# Boss Res all use msg/engus/. me3 mounts one file per path, so the two
# spellings are two different slots — the merge above would never see this mod's
# copy, and its rune descriptions would silently never load. erm refuses paths
# that differ only in case rather than guessing which one me3 resolves to, so
# the profile has to say which spelling wins.
#
# Lowercase, because that's the one already proven to mount in this stack: the
# merged menu_dlc02 sits at msg/engus/ and Boss Resurrection's grace menu draws
# from it correctly (it rendered as tofu when the merge wasn't happening).
[[renames]]
mod = "great-rune-overhaul"
paths = { "msg/engUS/item_dlc02.msgbnd.dcx" = "msg/engus/item_dlc02.msgbnd.dcx" }

# Smithbox workspace leftovers. The .js is a decompile of the emevd sitting next
# to it, not something the game reads; project.json is the editor's own file.
# The real event/common.emevd.dcx is content and stays — it's what grants the
# passives on rune activation.
[[prunes]]
mod = "great-rune-overhaul"
paths = [
    "project.json",
    "event/common.emevd.dcx.js",
]

# The Great Rune status icons. Both mods ship the whole ~204 MB menu atlas set,
# but their actual contributions barely overlap: Great Rune Overhaul adds ONE
# texture of its own, SB_Status_GRO_00, and the only shared texture whose
# content differs is SB_Icon_02_A — where Clever's copy is the larger one, with
# its weapon icons layered in, and this mod's is untouched vanilla. So base
# wins the shared name and the new texture comes across.
#
# Dropping it is what produced green squares in game: the icon reference lives
# in the SpEffectVfx rows, which survive the regulation merge either way, so the
# game goes looking for a texture that isn't there and draws the missing-texture
# placeholder. There is no "just don't show the icon" state to fall back to.
#
# Two-way, not three-way: vanilla's copy of this file exists only inside the
# game's .bdt archives, which erm can't read. That's workable here because a
# texture is keyed by name and an added icon sheet carries a name of its own —
# unlike FMG text, where telling an authored string from an untouched one is
# exactly what needs vanilla.
#
# The mod's matching menu/hi/01_common.sblytbnd.dcx (the layout that positions
# the icon) needs no merge — Clever's doesn't ship it, so it mounts as the sole
# provider. It has to stay unpruned though, or the texture arrives with nothing
# placing it.
[[merges]]
path = "menu/hi/01_common.tpf.dcx"
strategy = "tpf-union"
mods = ["clevers-moveset", "great-rune-overhaul"]
prefer = "clevers-moveset"

# Unedited editor artifact, same as the Boss Res systemparam below: byte-identical
# to the .prev Smithbox wrote beside it, so it carries nothing of the author's.
# Mounting it would override vanilla systemparam for no reason. The archive is the
# author's whole workspace — 245 files, of which only regulation.bin is content.
[[prunes]]
mod = "forever-buffs"
paths = [
    "param/systemparam/systemparam.parambnd.dcx",
    "param/systemparam/systemparam.parambnd.dcx.prev",
]

[[prunes]]
mod = "boss-resurrection-lite"
paths = [
    "msg/engus/item_dlc02.msgbnd.dcx",
    "param/systemparam/systemparam.parambnd.dcx",
]

# Both mods rewrite the site-of-grace talk machine, and that one file is the
# whole mod on either side, so neither can be pruned to make room. They collide
# on exactly one state group out of 86: Boss Res deletes three of its states and
# renumbers the survivors, while Melina hooks two of the states it deletes. The
# merge therefore matches states by content rather than by id -- see the strategy.
#
# prefer is Boss Res because it is the larger, already-shared mod and its rewrite
# is the more invasive; replaying Melina's interception onto it is the tractable
# direction.
[[merges]]
path = "script/talk/m00_00_00_00.talkesdbnd.dcx"
strategy = "esd-3way"
mods = ["boss-resurrection-lite", "journey-with-melina"]
prefer = "boss-resurrection-lite"
vanilla = { mod = "item-enemy-randomizer", member = "randomizer/diste/Vanilla/m00_00_00_00.talkesdbnd.dcx" }

# Boss Res's archive ships a Smithbox backup of the file above, a leftover from
# whatever edit session produced the real one. It is its own path, so it
# collides with nothing and me3 never mounts it -- this is hygiene, not a
# conflict fix. Keeping it would leave a stale copy of the pre-merge talk
# machine sitting in the installed package next to the merged one, which is
# exactly the thing to hand someone debugging a talk bug the wrong file.
[[prunes]]
mod = "boss-resurrection-lite"
paths = ["script/talk/m00_00_00_00.talkesdbnd.dcx.bak"]
