name = "seamless-randomizer"
description = "Full rebuild of the 2025 co-op randomizer run. EVERY player needs the identical generated regulation.bin + seed + mod versions."

[[mods]]
id = "seamless-coop"
# GitHub mirror 497113840 lags Nexus; source from Nexus (#510) for the real latest
source = "nexus"
nexus_id = 510
kind = "coop-framework"
install = "game"

# The loader: Steam runs the native Linux me3 and me3 builds the Proton command
# itself. Installed to ~/.local/bin (and the Windows components it chainloads to
# ~/.local/share/me3/windows-bin), which is where the launch option points.
[[mods]]
id = "me3-host"
source = "github"
repo_id = 540883721
asset_match = "me3-linux-amd64"
asset_suffix = ".tar.gz"
kind = "loader"
install = "me3-host"

[[mods]]
id = "item-enemy-randomizer"
source = "nexus"
nexus_id = 428
kind = "randomizer"
requires_all_players = true
install = "randomizer"
